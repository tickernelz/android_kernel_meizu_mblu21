name: build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag suffix used as <variant>-<release_tag>; empty means artifacts only"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  KERNEL_COMMON_SHA: be074b05e5aff5eb16a848fb3aaab2f73d687cb6
  BOOT_PARTITION_SIZE: "67108864"
  INIT_BOOT_PARTITION_SIZE: "8388608"
  KLEAF_FLAGS: --config=fast

jobs:
  kernel:
    name: kernel ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: sukisu-ultra
            root_url: https://github.com/SukiSU-Ultra/SukiSU-Ultra
            root_sha: b16e899a555e9b96aa1225f049cd7274820ca5b8
            kernel_patch: patches/0001-susfs-android13-5.15.patch
            required_config: CONFIG_KSU_SUSFS=y
          - variant: kernelsu-next
            root_url: https://github.com/KernelSU-Next/KernelSU-Next
            root_sha: cefb048b069b7439fb4020d043de2d338dbc00fa
            kernel_patch: none
            required_config: CONFIG_KSU=y
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm
          sudo apt-get clean
          df -h /

      - name: Install repotool
        run: |
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$HOME/bin/repo" https://storage.googleapis.com/git-repo-downloads/repo
          chmod +x "$HOME/bin/repo"

      - name: Sync kernel sources
        run: scripts/sync_sources.sh "$RUNNER_TEMP/gki" "$KERNEL_COMMON_SHA" "$(nproc)"

      - name: Apply ${{ matrix.variant }} integration
        run: |
          scripts/apply_root.sh "$RUNNER_TEMP/gki" "${{ matrix.root_url }}" "${{ matrix.root_sha }}" "$GITHUB_WORKSPACE/${{ matrix.kernel_patch }}" "CONFIG_KSU=y"

      - name: Build kernel
        run: |
          cd "$RUNNER_TEMP/gki"
          tools/bazel build $KLEAF_FLAGS //common:kernel_aarch64_dist

      - name: Collect artifacts
        id: collect
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/gki/out/dist"
          if [ ! -d "$dist" ]; then
            dist=$(dirname "$(find "$RUNNER_TEMP/gki" -name Module.symvers -not -path '*/bazel-*/*' | head -1)")
          fi
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
          ls -la "$dist"
          test -f "$dist/Image"
          test -f "$dist/Module.symvers"
          test -f "$dist/.config"
          grep -E '^CONFIG_KSU|^CONFIG_MODVERSIONS|^CONFIG_KPROBES|^CONFIG_KSU_SUSFS|^CONFIG_MODULE_SIG_PROTECT' "$dist/.config" | sort | tee config-report.txt
          grep -qx '${{ matrix.required_config }}' "$dist/.config"

      - name: Check module ABI against stock modules
        run: |
          set -euo pipefail
          dist="${{ steps.collect.outputs.dist }}"
            python3 scripts/module_abi.py check --imports abi/vendor_dlkm.imports.tsv --module-exports abi/vendor_dlkm.exports.tsv --symvers "$dist/Module.symvers" --self-test | tee abi-vendor_dlkm.txt
            python3 scripts/module_abi.py check --imports abi/system_dlkm.imports.tsv --module-exports abi/system_dlkm.exports.tsv --symvers "$dist/Module.symvers" --self-test | tee abi-system_dlkm.txt

      - name: Pack boot image
        run: |
          scripts/make_boot.sh "${{ steps.collect.outputs.dist }}/Image" "$RUNNER_TEMP/boot-${{ matrix.variant }}.img" "$GITHUB_WORKSPACE" "$BOOT_PARTITION_SIZE"

      - name: Verify boot image
        run: |
          python3 scripts/verify_image.py --image "$RUNNER_TEMP/boot-${{ matrix.variant }}.img" --max-size "$BOOT_PARTITION_SIZE" --header-version 4
          sha256sum "$RUNNER_TEMP/boot-${{ matrix.variant }}.img" | tee "$RUNNER_TEMP/boot-${{ matrix.variant }}.img.sha256"

      - name: Record validation summary
        run: |
          {
            echo "### ${{ matrix.variant }}"
            echo '```'
            cat config-report.txt
            echo '```'
            cat abi-vendor_dlkm.txt
            cat abi-system_dlkm.txt
            cat "$RUNNER_TEMP/boot-${{ matrix.variant }}.img.sha256"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: boot-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/boot-${{ matrix.variant }}.img
            ${{ runner.temp }}/boot-${{ matrix.variant }}.img.sha256
            config-report.txt
            abi-vendor_dlkm.txt
            abi-system_dlkm.txt

  lkm:
    name: lkm ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: sukisu-ultra
            ksud_repo: https://github.com/SukiSU-Ultra/SukiSU-Ultra
            ksud_ref: v4.3.0
            ksud_from_source: true
            kernelsu_ko_url: https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases/download/v4.3.0/lkm-aarch64-android13-5.15_kernelsu.ko
            ksuinit_url: https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases/download/v4.3.0/ksuinit-aarch64
          - variant: kernelsu-next
            ksud_repo: https://github.com/KernelSU-Next/KernelSU-Next
            ksud_ref: v3.4.2
            ksud_from_source: false
            ksud_url: https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/ksud-x86_64-unknown-linux-musl
            kernelsu_ko_url: https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.2/aarch64_android13-5.15_kernelsu.ko
            ksuinit_url: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install rust toolchain
        if: matrix.ksud_from_source
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Build ksud for the host
        if: matrix.ksud_from_source
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 --branch "${{ matrix.ksud_ref }}" "${{ matrix.ksud_repo }}" "$RUNNER_TEMP/ksud-src"
          cd "$RUNNER_TEMP/ksud-src"
          cargo build --release -p ksud
          install -m 0755 target/release/ksud "$RUNNER_TEMP/ksud"
          "$RUNNER_TEMP/ksud" --help | head -20

      - name: Download ksud
        if: ${{ !matrix.ksud_from_source }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ksud" "${{ matrix.ksud_url }}"
          chmod +x "$RUNNER_TEMP/ksud"
          "$RUNNER_TEMP/ksud" --help | head -20

      - name: Patch stock init_boot
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/kernelsu.ko" "${{ matrix.kernelsu_ko_url }}"
          if [ -n "${{ matrix.ksuinit_url }}" ]; then
            curl -fsSL -o "$RUNNER_TEMP/ksuinit" "${{ matrix.ksuinit_url }}"
            chmod +x "$RUNNER_TEMP/ksuinit"
          fi
          mkdir -p "$RUNNER_TEMP/lkm-out"
          scripts/patch_init_boot.sh "${{ matrix.variant }}" "$RUNNER_TEMP/ksud" "$RUNNER_TEMP/kernelsu.ko" "stock/init_boot_a.bin" "$RUNNER_TEMP/lkm-out" "$RUNNER_TEMP/ksuinit" | tee "$RUNNER_TEMP/lkm-${{ matrix.variant }}.log"
          image=$(find "$RUNNER_TEMP/lkm-out" -name '*.img' | head -1)
          python3 scripts/verify_image.py --image "$image" --max-size "$INIT_BOOT_PARTITION_SIZE" --header-version 4 --contains kernelsu.ko --min-ramdisk-size 2200000 | tee "$RUNNER_TEMP/lkm-verify-${{ matrix.variant }}.json"
          cp "$image" "$RUNNER_TEMP/init_boot-${{ matrix.variant }}-lkm.img"
          sha256sum "$RUNNER_TEMP/init_boot-${{ matrix.variant }}-lkm.img" | tee "$RUNNER_TEMP/init_boot-${{ matrix.variant }}-lkm.img.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: lkm-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/init_boot-${{ matrix.variant }}-lkm.img
            ${{ runner.temp }}/init_boot-${{ matrix.variant }}-lkm.img.sha256
            ${{ runner.temp }}/lkm-${{ matrix.variant }}.log

  release:
    name: publish UNTESTED pre-releases
    runs-on: ubuntu-latest
    needs: [kernel, lkm]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Create releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_suffix="${{ inputs.release_tag }}"
          for variant in sukisu-ultra kernelsu-next; do
            tag="$variant-$tag_suffix-untested"
            dir="assets/boot-$variant"
            cp "assets/lkm-$variant/init_boot-$variant-lkm.img" "$dir/"
            cp "assets/lkm-$variant/init_boot-$variant-lkm.img.sha256" "$dir/"
            cp "assets/lkm-$variant/lkm-$variant.log" "$dir/"
            gh release delete "$tag" --yes --cleanup-tag || true
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "UNTESTED - $variant $tag_suffix" \
              --notes-file "release-notes/$variant.md" \
              "$dir/boot-$variant.img" "$dir/boot-$variant.img.sha256" \
              "$dir/init_boot-$variant-lkm.img" "$dir/init_boot-$variant-lkm.img.sha256" \
              "$dir/abi-vendor_dlkm.txt" "$dir/abi-system_dlkm.txt" "$dir/config-report.txt" "$dir/lkm-$variant.log"
          done
