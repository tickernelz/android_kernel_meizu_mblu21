name: root-modules

on:
  push:
    paths:
      - '.github/workflows/root-modules.yml'
      - 'scripts/module_abi.py'
      - 'scripts/bootimg.py'
      - 'scripts/build_kasumi.sh'
      - 'scripts/kallsyms-requirements.txt'
      - 'root/kasumi-module/**'
      - 'keys/yukisu-anatdx.asc'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag suffix used as <variant>-<release_tag>-untested; empty means artifacts only"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: root-modules-${{ github.ref }}
  cancel-in-progress: false

env:
  STOCK_BOOT_URL: https://github.com/tickernelz/android_stock_meizu_mblu21/releases/download/mblu21-stock-U01005-20261031/boot_a.bin
  STOCK_BOOT_SHA256: 3a78e1394a5c3c52252384c7a136ae3c6c4fd758f0ba4a781c91813b1352f6da
  YUKISU_RELEASE: https://github.com/Rouyashiki/YukiSU/releases/download/v1.8.1
  YUKISU_KEY_FPR: 71B2B58C2A543472BE0DA0D8F580A2CEEF67DC98
  SUKISU_KO_URL: https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases/download/v4.3.0/lkm-aarch64-android13-5.15_kernelsu.ko
  SUKISU_KO_SHA256: c82513223b08404c51399595e38fe4e423d5bc5eb4e89f2c2765e139b548cff2
  KASUMI_REPO: https://github.com/Rouyashiki/Kasumi
  KASUMI_COMMIT: 049d5e93f0e25877b0125da31bdef7fdd07e5c01
  KASUMI_KO_SHA256: cc20e3a908ba487688205efdc0b0cd862b08d003a7faf95437e7da7c384ed09f
  DDK_IMAGE: ghcr.io/ylarod/ddk-min@sha256:9e68cd9fcab748584755d31ba88ef134efc938dbde17f258c2652315f6cd81cd
  YUKIZYGISK_ZIP_URL: https://github.com/Rouyashiki/YukiZygisk/releases/download/ci-41973134583/YukiZygisk-v0.3.0-10136-all-kmi-arm64-v8a.zip
  YUKIZYGISK_ZIP_SHA256: 710ba1e9ae8560b0697d87b816c98ff90fe50ac5ce650d59e33fd74554796b55
  YUKIZYGISK_SUMS_URL: https://github.com/Rouyashiki/YukiZygisk/releases/download/ci-41973134583/SHA256SUMS
  YUKIZYGISK_SUMS_SHA256: 2530cd5d70fb35998f5a7b65591af6582fc2ff04fe94c85287048b2a5fd24699
  YUKIZYGISK_KO_SHA256: d6845bcf752d4997d8fac1fba4f65ae37200b1e28e0049e866a0fef569b30440

jobs:
  module:
    name: root module ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [yukisu, kasumi, yukizygisk]
    env:
      OUT: ${{ github.workspace }}/out-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Stock kernel symbol table
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/boot_a.bin" "$STOCK_BOOT_URL"
          echo "$STOCK_BOOT_SHA256  $RUNNER_TEMP/boot_a.bin" | sha256sum -c -
          python3 scripts/bootimg.py kernel "$RUNNER_TEMP/boot_a.bin" "$RUNNER_TEMP/Image"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --no-deps --require-hashes -r scripts/kallsyms-requirements.txt
          "$RUNNER_TEMP/venv/bin/kallsyms-finder" "$RUNNER_TEMP/Image" > "$RUNNER_TEMP/kallsyms.txt"
          vermagic=$(strings -a "$RUNNER_TEMP/Image" | grep -m1 -E '^5\.15\.149-[^ ]+ SMP ')
          echo "stock kernel vermagic: $vermagic" | tee "$OUT/module-abi-${{ matrix.variant }}.txt"
          echo "KERNEL_VERMAGIC_FLAGS=${vermagic#* }" >> "$GITHUB_ENV"
          echo "KERNEL_RELEASE=${vermagic%% *}" >> "$GITHUB_ENV"
          python3 - "$RUNNER_TEMP/Image" "$RUNNER_TEMP/ikconfig.txt" <<'EOF'
          import gzip, sys
          data = open(sys.argv[1], "rb").read()
          start = data.index(b"IKCFG_ST") + 8
          open(sys.argv[2], "wb").write(gzip.decompress(data[start:data.index(b"IKCFG_ED", start)]))
          EOF
          if grep -E '^CONFIG_(KSU_SUSFS|NOMOUNT|HYBRIDMOUNT)=y' "$RUNNER_TEMP/ikconfig.txt"; then
            echo "stock IKCONFIG enables a Kasumi conflict" >&2
            exit 1
          fi
          echo "stock IKCONFIG: $(wc -l < "$RUNNER_TEMP/ikconfig.txt") lines, no CONFIG_KSU_SUSFS/NOMOUNT/HYBRIDMOUNT" | tee -a "$OUT/module-abi-${{ matrix.variant }}.txt"

      - name: Fetch and verify YukiSU v1.8.1
        if: matrix.variant == 'yukisu'
        run: |
          set -euo pipefail
          cd "$OUT"
          while read -r sha name; do
            curl -fsSL --retry 3 -o "$name" "$YUKISU_RELEASE/$name"
            echo "$sha  $name" | sha256sum -c -
          done <<'EOF'
          b74c9742578671ce44d84fd0337cbd29ebe09843a96d3211e17485ac0828b57c android13-5.15_kernelsu.ko
          09c324c6face7013798fd096f2cf311f31e0b573611e516df87fc4dbe30a4c16 android13-5.15_kernelsu.ko.sig
          7033700c0582633a657025c7fdbb3bd34cb2352a7a7aa9cd5e54f5725ff1b6a9 ksud-aarch64-linux-android
          53fc17674e915d50ba8afefab6cb56168a4ec84df1db82d8d5c44d7361546c31 ksud-aarch64-linux-android.sig
          42c7bdb543e09c278549b3c7949bd63229606e882c5e5774c61207ecc906cc31 YukiSU_v1.8.1_10680-arm64-v8a-release.apk
          11d18fa6e06a2b48f87dc309c6551f2816558e45802d9c627e2c39a33d2b339b YukiSU_v1.8.1_10680-arm64-v8a-release.apk.asc
          EOF
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --quiet --import "$GITHUB_WORKSPACE/keys/yukisu-anatdx.asc"
          for pair in android13-5.15_kernelsu.ko:sig ksud-aarch64-linux-android:sig YukiSU_v1.8.1_10680-arm64-v8a-release.apk:asc; do
            file=${pair%%:*}
            gpg --status-fd 1 --verify "$file.${pair##*:}" "$file" 2>/dev/null | grep -E "^\[GNUPG:\] VALIDSIG .* $YUKISU_KEY_FPR$" > /dev/null
            echo "signature ok: $file (primary key $YUKISU_KEY_FPR)" | tee -a "module-abi-yukisu.txt"
          done
          {
            echo "embedded Kasumi strings: $(strings -a android13-5.15_kernelsu.ko | grep -c 'kasumi:')"
            echo "embedded YukiZygisk symbols: $(readelf -sW android13-5.15_kernelsu.ko | awk '{print $8}' | grep -cE '^(yz_|ksu_yukizygisk)')"
          } | tee -a "module-abi-yukisu.txt"
          echo "MODULES=$OUT/android13-5.15_kernelsu.ko" >> "$GITHUB_ENV"

      - name: Build kasumi_lkm.ko from source
        if: matrix.variant == 'kasumi'
        run: |
          set -euo pipefail
          git clone --quiet "$KASUMI_REPO" "$RUNNER_TEMP/kasumi"
          git -C "$RUNNER_TEMP/kasumi" checkout --quiet "$KASUMI_COMMIT"
          docker run --rm --memory 4g --memory-swap 4g --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$RUNNER_TEMP/kasumi:/src" -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            "$DDK_IMAGE" /scripts/build_kasumi.sh /src /src/kasumi_lkm.ko
          cp "$RUNNER_TEMP/kasumi/kasumi_lkm.ko" "$OUT/kasumi_lkm.ko"
          echo "$KASUMI_KO_SHA256  $OUT/kasumi_lkm.ko" | sha256sum -c -
          curl -fsSL --retry 3 -o "$OUT/kernelsu.ko" "$SUKISU_KO_URL"
          echo "$SUKISU_KO_SHA256  $OUT/kernelsu.ko" | sha256sum -c -
          root/kasumi-module/build-module.sh "$OUT/kasumi_lkm-module.zip" "$OUT/kasumi_lkm.ko"
          {
            echo "kasumi: $KASUMI_REPO at $KASUMI_COMMIT, built in $DDK_IMAGE"
            echo "kasumi_lkm.ko sha256 $KASUMI_KO_SHA256 (reproducible; CI rebuilds and compares)"
            echo "root driver: SukiSU-Ultra $SUKISU_KO_URL sha256 $SUKISU_KO_SHA256"
          } | tee -a "$OUT/module-abi-kasumi.txt"
          echo "MODULES=$OUT/kernelsu.ko $OUT/kasumi_lkm.ko" >> "$GITHUB_ENV"

      - name: Fetch and verify YukiZygisk
        if: matrix.variant == 'yukizygisk'
        run: |
          set -euo pipefail
          cd "$OUT"
          zip=$(basename "$YUKIZYGISK_ZIP_URL")
          curl -fsSL --retry 3 -o "$zip" "$YUKIZYGISK_ZIP_URL"
          curl -fsSL --retry 3 -o SHA256SUMS "$YUKIZYGISK_SUMS_URL"
          echo "$YUKIZYGISK_ZIP_SHA256  $zip" | sha256sum -c -
          echo "$YUKIZYGISK_SUMS_SHA256  SHA256SUMS" | sha256sum -c -
          sha256sum -c SHA256SUMS
          unzip -q -o "$zip" lkm/android13-5.15_yukizygisk.ko lkm/android13-5.15_yukizygisk.ko.sha256 -d "$RUNNER_TEMP/yz"
          cp "$RUNNER_TEMP/yz/lkm/android13-5.15_yukizygisk.ko" yukizygisk.ko
          echo "$(cat "$RUNNER_TEMP/yz/lkm/android13-5.15_yukizygisk.ko.sha256")  yukizygisk.ko" | sha256sum -c -
          echo "$YUKIZYGISK_KO_SHA256  yukizygisk.ko" | sha256sum -c -
          rm SHA256SUMS
          echo "yukizygisk: $zip sha256 $YUKIZYGISK_ZIP_SHA256, android13-5.15 LKM sha256 $YUKIZYGISK_KO_SHA256" | tee -a "module-abi-yukizygisk.txt"
          echo "MODULES=$OUT/yukizygisk.ko" >> "$GITHUB_ENV"

      - name: Check modules against the stock kernel
        run: |
          set -euo pipefail
          read -ra modules <<< "$MODULES"
          python3 scripts/module_abi.py lkm --kallsyms "$RUNNER_TEMP/kallsyms.txt" --modules "${modules[@]}" \
            --release-prefix 5.15. --kernel-release "$KERNEL_RELEASE" --vermagic-flags "$KERNEL_VERMAGIC_FLAGS" --require is_subdir --self-test \
            | tee -a "$OUT/module-abi-${{ matrix.variant }}.txt"
          (cd "$OUT" && sha256sum -- * > "SHA256SUMS-${{ matrix.variant }}")
          {
            echo "### ${{ matrix.variant }}"
            echo '```'
            cat "$OUT/module-abi-${{ matrix.variant }}.txt"
            cat "$OUT/SHA256SUMS-${{ matrix.variant }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: root-${{ matrix.variant }}
          if-no-files-found: error
          path: ${{ env.OUT }}/

  release:
    name: publish UNTESTED pre-releases
    runs-on: ubuntu-latest
    needs: [module]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Create releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "release_tag must match ^[A-Za-z0-9._-]+$" >&2
            exit 1
          fi
          for variant in yukisu kasumi yukizygisk; do
            tag="$variant-$RELEASE_TAG-untested"
            (cd "assets/root-$variant" && sha256sum -c "SHA256SUMS-$variant")
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release $tag already exists; pick a new release_tag" >&2
              exit 1
            fi
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "UNTESTED - $variant $RELEASE_TAG" \
              --notes-file "release-notes/$variant.md" \
              assets/root-$variant/*
          done
