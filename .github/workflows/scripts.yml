name: scripts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

      - name: python syntax
        run: python3 -m py_compile scripts/*.py
